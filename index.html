<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071007">
<title>废土之旅</title>
<style>
  :root {
    --bg: #071007;
    --fg: #3dff6e;
    --dim: #1d7a36;
  }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
  }
  body {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    font-family: Consolas, Menlo, "DejaVu Sans Mono", "Noto Sans Mono CJK SC", "Microsoft YaHei Mono", monospace;
  }
  /* 屏幕: 字号跟着屏幕宽度变, 让 60 个字宽的字符画在手机上也放得下 */
  #screen {
    flex: 1;
    margin: 0;
    padding: 8px 10px;
    overflow-y: auto;
    font-family: inherit;   /* <pre> 自己带着默认字体, 要让它用上面 body 设的字体 */
    white-space: pre-wrap;
    word-break: break-all;
    font-size: clamp(8px, calc((100vw - 24px) / 37), 16px);
    line-height: 1.3;
    text-shadow: 0 0 4px rgba(61, 255, 110, 0.45);
  }
  /* 游戏里的颜色 (Python 那边用 ANSI 控制字符上色, 下面的 write() 把它们换成这些样式) */
  .c31 { color: #ff6b6b; text-shadow: 0 0 4px rgba(255, 107, 107, 0.45); }   /* 红 */
  .c32 { color: #3dff6e; }                                                   /* 绿 */
  .c33 { color: #ffd75f; text-shadow: 0 0 4px rgba(255, 215, 95, 0.45); }    /* 黄 */
  .c34 { color: #6cb6ff; text-shadow: 0 0 4px rgba(108, 182, 255, 0.45); }   /* 蓝 */
  .c35 { color: #ff7af0; text-shadow: 0 0 4px rgba(255, 122, 240, 0.45); }   /* 紫 */
  .c36 { color: #5ff5ff; text-shadow: 0 0 4px rgba(95, 245, 255, 0.45); }    /* 青 */
  .c90 { color: #5f8f6a; text-shadow: none; }                                /* 灰 */
  .bold { font-weight: bold; }
  #controls {
    border-top: 1px solid var(--dim);
    padding: 8px;
  }
  #bar {
    display: flex;
    gap: 6px;
  }
  #answer {
    flex: 1;
    min-width: 0;
    padding: 8px;
    font: inherit;
    font-size: 16px;   /* 16px 以上 iPhone 才不会在点输入框时自动放大网页 */
    color: var(--fg);
    background: #000;
    border: 1px solid var(--dim);
    border-radius: 4px;
  }
  button {
    font: inherit;
    font-size: 16px;
    color: var(--bg);
    background: var(--fg);
    border: none;
    border-radius: 4px;
    padding: 8px 14px;
    cursor: pointer;
  }
  button:disabled {
    background: var(--dim);
    cursor: default;
  }
  /* 手机上点数字用的小键盘 */
  #keypad {
    display: grid;
    grid-template-columns: repeat(11, 1fr);
    gap: 4px;
    margin-top: 6px;
  }
  #keypad button {
    padding: 8px 0;
    color: var(--fg);
    background: #000;
    border: 1px solid var(--dim);
  }
</style>
</head>
<body>
<pre id="screen" aria-live="polite"></pre>
<div id="controls">
  <form id="bar" autocomplete="off">
    <input id="answer" aria-label="你的回答" maxlength="200" disabled
           autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="等游戏载入……">
    <button id="send" type="submit" disabled>确定</button>
  </form>
  <div id="keypad"></div>
</div>

<script>
  const SAVE_KEY = "wasteland-trail-save";       // 存档在浏览器里的名字
  const SCORES_KEY = "wasteland-trail-scores";   // 最高分榜在浏览器里的名字
  const screenBox = document.getElementById("screen");
  const answer = document.getElementById("answer");
  const send = document.getElementById("send");

  // ---------- 屏幕: 一个很简单的「终端」 ----------
  // 游戏的动画会用控制字符把光标往上移 (比如 ESC[11A 是上移 11 行), 再画新的一帧盖掉旧的。
  // 这里用一行一行的文字记住屏幕上的内容, 再记住光标在第几行、第几个字。
  const lines = [""];
  const looks = [[]];   // 每个字是什么颜色: looks[第几行][第几个字] 是 CSS 样式的名字 (空的就是默认的绿色)
  let look = "";        // 现在写出来的字用什么颜色
  let row = 0;
  let col = 0;
  let unfinished = "";   // 一个控制字符可能被切成两段送过来, 先留着等下一段
  let drawScheduled = false;

  function write(text) {
    text = unfinished + text;
    unfinished = "";
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (ch === "\x1b") {
        const rest = text.slice(i);
        const code = rest.match(/^\x1b\[(\??)([\d;]*)([A-Za-z])/);
        if (!code) {
          if (rest.length < 8) {   // 还没收完整
            unfinished = rest;
            break;
          }
          continue;   // 不认得的控制字符, 跳过
        }
        if (code[3] === "A" && !code[1]) {   // 光标往上移几行
          row = Math.max(0, row - Number(code[2] || 1));
        } else if (code[3] === "m") {        // 换颜色, 比如 ESC[31m 是红色, ESC[33;1m 是黄色加粗, ESC[0m 变回原样
          look = lookFor(code[2]);
        }                                    // 其他的 (比如藏光标、显示光标) 这里用不着
        i += code[0].length - 1;
        continue;
      }
      if (ch === "\n") {
        row++;
        col = 0;
        if (row >= lines.length) {
          lines.push("");
          looks.push([]);
        }
        continue;
      }
      if (ch === "\r") {
        col = 0;
        continue;
      }
      const line = lines[row].padEnd(col);
      lines[row] = line.slice(0, col) + ch + line.slice(col + 1);
      const rowLooks = looks[row];
      while (rowLooks.length < col) rowLooks.push("");   // 补上的空格用默认颜色
      rowLooks[col] = look;
      col++;
    }
    // 只留最近的 2000 行, 免得玩久了网页越来越慢
    if (lines.length > 2000) {
      const extra = lines.length - 2000;
      lines.splice(0, extra);
      looks.splice(0, extra);
      row = Math.max(0, row - extra);
    }
    if (!drawScheduled) {
      drawScheduled = true;
      requestAnimationFrame(draw);
    }
  }

  // 把 "31;1" 这样的颜色编号换成 CSS 样式的名字, 比如 "c31 bold"。0 或者空的就是变回原样
  function lookFor(numbers) {
    const names = [];
    for (const number of numbers.split(";")) {
      if (number === "1") names.push("bold");
      else if (number && number !== "0") names.push("c" + number);
    }
    return names.join(" ");
  }

  function escapeHtml(text) {
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function draw() {
    drawScheduled = false;
    // 一行一行拼成网页: 颜色一样的连续几个字放进同一个 <span>
    const parts = [];
    for (let r = 0; r < lines.length; r++) {
      if (r) parts.push("\n");
      const line = lines[r];
      const rowLooks = looks[r];
      let start = 0;
      while (start < line.length) {
        const style = rowLooks[start] || "";
        let end = start + 1;
        while (end < line.length && (rowLooks[end] || "") === style) end++;
        const text = escapeHtml(line.slice(start, end));
        parts.push(style ? `<span class="${style}">${text}</span>` : text);
        start = end;
      }
    }
    screenBox.innerHTML = parts.join("");
    screenBox.scrollTop = screenBox.scrollHeight;
  }

  // ---------- 存档和最高分: 存在浏览器的 localStorage 里 (隐私模式下可能用不了, 那就不存) ----------
  function readStored(key) {
    try { return localStorage.getItem(key) || ""; } catch (e) { return ""; }
  }
  function writeStored(key, text) {
    try {
      if (text) localStorage.setItem(key, text);
      else localStorage.removeItem(key);
    } catch (e) { /* 存不了就算了 */ }
  }

  // ---------- 输入: 把玩家输入的字放进和后台线程共用的内存, 再叫醒它 ----------
  let memory, control, letters;
  let waiting = false;   // 游戏是不是正在等玩家输入

  function askForAnswer() {
    waiting = true;
    answer.disabled = false;
    send.disabled = false;
    answer.placeholder = "在这里输入, 按回车或点「确定」";
    answer.focus({ preventScroll: true });
  }

  document.getElementById("bar").addEventListener("submit", (event) => {
    event.preventDefault();
    if (!waiting) return;
    const text = answer.value;
    answer.value = "";
    write(text + "\n");   // 像终端一样, 把输入的字显示在问题后面
    const bytes = new TextEncoder().encode(text).slice(0, letters.length);
    letters.set(bytes);
    control[1] = bytes.length;
    Atomics.store(control, 0, 1);
    Atomics.notify(control, 0);
    waiting = false;
    send.disabled = true;
  });

  // 小键盘: 1~9、0 和退格
  const keypad = document.getElementById("keypad");
  for (const key of ["1", "2", "3", "4", "5", "6", "7", "8", "9", "0", "←"]) {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = key;
    button.addEventListener("click", () => {
      answer.value = key === "←" ? answer.value.slice(0, -1) : answer.value + key;
    });
    keypad.appendChild(button);
  }

  // ---------- 启动 ----------
  function remember(key, value) {
    try {
      if (value) sessionStorage.setItem(key, value);
      else sessionStorage.removeItem(key);
    } catch (e) { /* 用不了就算了 */ }
  }
  function recall(key) {
    try { return sessionStorage.getItem(key); } catch (e) { return null; }
  }

  async function start() {
    // 等玩家输入要用 SharedArrayBuffer, 得先让 sw.js 装好, 再刷新一次网页才能用
    if (!window.crossOriginIsolated) {
      if ("serviceWorker" in navigator && !recall("reloaded-for-sw")) {
        try {
          await navigator.serviceWorker.register("sw.js");
          await navigator.serviceWorker.ready;
          remember("reloaded-for-sw", "1");
          location.reload();
          return;
        } catch (e) { /* 装不上, 往下走, 显示提示 */ }
      }
      write("这个浏览器暂时玩不了网页版。\n请换最新版的 Chrome、Edge、Firefox 或 Safari 再试试,\n或者下载游戏在电脑上玩: https://github.com/aizhang453-hash/wasteland-trail\n");
      return;
    }
    remember("reloaded-for-sw", "");

    memory = new SharedArrayBuffer(8 + 1024);
    control = new Int32Array(memory, 0, 2);
    letters = new Uint8Array(memory, 8);

    const worker = new Worker("web/worker.js", { type: "module" });
    worker.onmessage = (event) => {
      const message = event.data;
      if (message.type === "output") write(message.text);
      else if (message.type === "need-input") askForAnswer();
      else if (message.type === "save") writeStored(SAVE_KEY, message.text);
      else if (message.type === "scores") writeStored(SCORES_KEY, message.text);
      else if (message.type === "status") answer.placeholder = message.text || "等游戏开始……";
      else if (message.type === "finished") {
        write("\n—— 游戏已经关掉了。刷新网页可以重新开始。——\n");
        answer.disabled = true;
        send.disabled = true;
        answer.placeholder = "刷新网页可以重新开始";
      }
    };
    worker.onerror = (event) => write("\n网页版出错了: " + event.message + "\n");
    write("正在启动废土之旅……\n");
    worker.postMessage({ inputMemory: memory, savedGame: readStored(SAVE_KEY), savedScores: readStored(SCORES_KEY) });
  }

  start();
</script>
</body>
</html>
